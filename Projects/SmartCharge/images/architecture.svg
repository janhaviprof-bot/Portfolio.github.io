<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="SmartCharge system architecture">
  <defs>
    <style>
      .box { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 2; }
      .api { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #0f172a; }
      .small { font-size: 11px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#334155"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="120" width="120" height="60" rx="8"/>
  <text class="label" x="80" y="155" text-anchor="middle">Browser</text>
  <rect class="box" x="180" y="40" width="280" height="220" rx="10"/>
  <text class="label" x="320" y="68" text-anchor="middle" font-weight="bold">Shiny App</text>
  <rect class="box" x="200" y="85" width="90" height="40" rx="6"/>
  <text class="small" x="245" y="110" text-anchor="middle">app.py</text>
  <rect class="box" x="310" y="85" width="90" height="40" rx="6"/>
  <text class="small" x="355" y="110" text-anchor="middle">server.py</text>
  <rect class="box" x="255" y="145" width="130" height="40" rx="6"/>
  <text class="small" x="320" y="170" text-anchor="middle">utils.py</text>
  <rect class="box" x="255" y="200" width="130" height="40" rx="6"/>
  <text class="small" x="320" y="225" text-anchor="middle">ui_components.py</text>
  <line class="arrow" x1="140" y1="150" x2="178" y2="150"/>
  <line class="arrow" x1="460" y1="110" x2="520" y2="80"/>
  <line class="arrow" x1="460" y1="130" x2="520" y2="120"/>
  <line class="arrow" x1="460" y1="150" x2="520" y2="160"/>
  <line class="arrow" x1="460" y1="170" x2="520" y2="200"/>
  <rect class="api" x="520" y="55" width="130" height="42" rx="6"/>
  <text class="small" x="585" y="80" text-anchor="middle">Carbon Intensity API</text>
  <rect class="api" x="520" y="105" width="130" height="42" rx="6"/>
  <text class="small" x="585" y="130" text-anchor="middle">API Ninjas EV</text>
  <rect class="api" x="520" y="155" width="130" height="42" rx="6"/>
  <text class="small" x="585" y="180" text-anchor="middle">OpenAI</text>
  <rect class="api" x="520" y="205" width="130" height="42" rx="6"/>
  <text class="small" x="585" y="230" text-anchor="middle">Ollama Cloud</text>
  <text class="small" x="410" y="305" text-anchor="middle">Data flow: vehicle lookup ’ EV specs ’ 48h forecast ’ LLM slot ranking ’ calendar export</text>
</svg>
