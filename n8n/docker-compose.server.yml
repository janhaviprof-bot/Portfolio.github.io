# Hetzner / VPS: n8n listens on localhost only (use SSH tunnel for UI).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d

services:
  n8n:
    # !override replaces base "5678:5678" — merging both causes "address already in use"
    ports: !override
      - "127.0.0.1:5678:5678"
    environment:
      - EXECUTIONS_TIMEOUT=7200
      - EXECUTIONS_TIMEOUT_MAX=7200
